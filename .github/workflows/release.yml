name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
  id-token: write

jobs:
  release:
    name: Publish to npm & GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # Pin Node + npm versions required for trusted publishing (npm >= 11.5.1,
      # Node >= 22.14). setup-node's registry-url enables OIDC token exchange.
      - name: Install Node & npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1 (OIDC exchange).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --coverage --coverage-reporter=lcov

      - name: Enforce coverage
        run: bun ./scripts/check-coverage.ts

      - name: Build
        run: bun run build

      - name: Read package version
        id: pkg
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: check
        run: |
          if npm view homebridge-intesis-accloud@${{ steps.pkg.outputs.VERSION }} version >/dev/null 2>&1; then
            echo "VERSION_CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION_CHANGED=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing)
        if: steps.check.outputs.VERSION_CHANGED == 'true'
        run: npm publish --provenance --access public

      - name: Tag release
        if: steps.check.outputs.VERSION_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.pkg.outputs.VERSION }}
          git push origin v${{ steps.pkg.outputs.VERSION }}

      - name: Create GitHub Release
        if: steps.check.outputs.VERSION_CHANGED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          generate_release_notes: true
          name: v${{ steps.pkg.outputs.VERSION }}
