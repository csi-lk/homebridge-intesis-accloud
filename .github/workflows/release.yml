name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
  id-token: write

jobs:
  release:
    name: Publish to npm & GitHub
    runs-on: ubuntu-latest
    # Skip the run triggered by a merge of our own release PR (its commit
    # message carries [skip ci] and this guard is belt-and-braces).
    if: github.event.head_commit.author.username != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # Pin Node + npm versions required for trusted publishing (npm >= 11.5.1,
      # Node >= 22.14). setup-node's registry-url enables OIDC token exchange.
      - name: Install Node & npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --coverage --coverage-reporter=lcov

      - name: Enforce coverage
        run: bun ./scripts/check-coverage.ts

      - name: Build
        run: bun run build

      - name: Read current version
        id: current
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # If the current package.json version is already on npm, we auto-bump the
      # patch. Manual minor/major bumps are detected and respected instead.
      - name: Check if current version is already published
        id: check
        run: |
          if npm view homebridge-intesis-accloud@${{ steps.current.outputs.VERSION }} version >/dev/null 2>&1; then
            echo "NEEDS_BUMP=true" >> "$GITHUB_OUTPUT"
          else
            echo "NEEDS_BUMP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-bump patch version
        if: steps.check.outputs.NEEDS_BUMP == 'true'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));const m=p.version.match(/^(\d+)\.(\d+)\.(\d+)(.+)?$/);p.version=\`\${m[1]}.\${m[2]}.\${+m[3]+1}\${m[4]||''}\`;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          echo "Bumped to $(node -p "require('./package.json').version")"

      - name: Read final version
        id: pkg
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A previous run may already have published this exact bumped version
      # (e.g. two merges raced). npm forbids re-publishing a version, so bail
      # early in that case.
      - name: Check bumped version is not already published
        id: check-bumped
        run: |
          if npm view homebridge-intesis-accloud@${{ steps.pkg.outputs.VERSION }} version >/dev/null 2>&1; then
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_OUTPUT"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog section
        if: steps.check-bumped.outputs.ALREADY_PUBLISHED == 'false'
        id: changelog
        run: |
          {
            echo "SECTION<<EOF"
            bun ./scripts/generate-changelog.ts ${{ steps.pkg.outputs.VERSION }}
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepend changelog entry
        if: steps.check-bumped.outputs.ALREADY_PUBLISHED == 'false'
        run: |
          mkdir -p /tmp/changelog
          # Ensure a "# Changelog" heading, then insert the new section after it.
          { echo "# Changelog"; printf '\n'; printf '%s\n' "${{ steps.changelog.outputs.SECTION }}"; grep -v '^# Changelog$' CHANGELOG.md || true; } > /tmp/changelog/CHANGELOG.md
          cp /tmp/changelog/CHANGELOG.md CHANGELOG.md

      - name: Publish to npm (trusted publishing)
        if: steps.check-bumped.outputs.ALREADY_PUBLISHED == 'false'
        run: npm publish --provenance --access public

      # Commit the version bump + changelog on a release branch so the tag can
      # point at the exact commit that matches what was published to npm.
      - name: Commit bump on release branch
        if: steps.check.outputs.NEEDS_BUMP == 'true' && steps.check-bumped.outputs.ALREADY_PUBLISHED == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release/v${{ steps.pkg.outputs.VERSION }}
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.pkg.outputs.VERSION }}"
          git push origin release/v${{ steps.pkg.outputs.VERSION }}

      - name: Tag release
        if: steps.check-bumped.outputs.ALREADY_PUBLISHED == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.pkg.outputs.VERSION }}
          git push origin v${{ steps.pkg.outputs.VERSION }}

      - name: Create GitHub Release
        if: steps.check-bumped.outputs.ALREADY_PUBLISHED == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          generate_release_notes: true
          name: v${{ steps.pkg.outputs.VERSION }}

      # main is branch-protected (requires PRs), so the version bump + changelog
      # are landed via a PR instead of a direct push. The PR title carries
      # [skip ci] so merging it does not re-trigger this workflow. It is
      # auto-merged (squash) since it is fully generated by this pipeline.
      - name: Open release PR for version bump
        if: steps.check.outputs.NEEDS_BUMP == 'true' && steps.check-bumped.outputs.ALREADY_PUBLISHED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL="$(gh pr create \
            --base main \
            --head release/v${{ steps.pkg.outputs.VERSION }} \
            --title "chore: release v${{ steps.pkg.outputs.VERSION }} [skip ci]" \
            --body "Automated release: bump package.json to v${{ steps.pkg.outputs.VERSION }} and update CHANGELOG.md. Merging keeps main in sync with what was published to npm.")"
          echo "$PR_URL"
          gh pr merge "$PR_URL" --auto --squash
